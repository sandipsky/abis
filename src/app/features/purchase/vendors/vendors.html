<div class="section main">
    <div class="section-header">
        <filter-section (onFilterChange)="applyFilter($event)"
                        [filterColumns]="filterColumns()"
                        searchBy="name">
        </filter-section>

        <div class="section-header-btn-group">
            @if (hasPermission('ExportVendor')) {
                <app-button (click)="printPage()" type="secondary" icon="print" label="Print" />
                <app-button (click)="getMasterList(true)" type="secondary" icon="download" label="Export" />
            }

            @if (hasPermission('CreateVendor')) {
                <app-button (click)="showForm()" type="primary" icon="add" label="Add Vendor" />
            }
        </div>
    </div>

    <div class="section-content">
        <app-table
            [actions]="['view', 'edit', 'delete']"
            (sortChange)="onSort($event)"
            [tableHeaders]="tableHeaders()"
            [hasDeletePermission]="hasPermission('DeleteVendor')"
            [hasEditPermission]="hasPermission('EditVendor')"
            [filterData]="filterForm()"
            [tableData]="masterList()"
            (onView)="showForm($event, true)"
            (onEdit)="showForm($event)"
            (onDelete)="deleteItem($event)">
        </app-table>

        <app-paginator
            (pageChange)="onChangedPage($event)"
            [pageSize]="filterForm().pageSize"
            [length]="length()"
            [pageIndex]="filterForm().pageIndex">
        </app-paginator>
    </div>
</div>
