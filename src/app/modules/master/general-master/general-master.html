<div class="section main">
  <div class="section-header">
    <filter-section 
      (onFilterChange)="applyFilter($event)" 
      [filterColumns]="filterColumns()"
      searchBy="name">
    </filter-section>

    <div class="section-header-btn-group">
      <app-button (click)="printPage()" type="secondary" icon="print" label="Print" />

      <app-button (click)="getMasterList(true)" type="secondary" icon="download" label="Export" />

      <app-button
        *ngIf="operationList().includes(createMasterPermissionName()) || true"
        (click)="openAddModal()"
        type="primary"
        icon="add"
        [label]="'Add ' + masterName()" />
    </div>
  </div>

  <div class="section-content">
    <app-table 
      [actions]="['edit', 'delete']" 
      [tableHeaders]="tableHeaders()" 
      [tableData]="masterList()"
      (sortChange)="onSort($event)"
      (onEdit)="openAddModal($event)"
      (onDelete)="openDelete($event)">
    </app-table>

    <app-paginator 
      (pageChange)="onChangedPage($event)" 
      [pageSize]="filterForm().pageSize" 
      [length]="totalElements()"
      [pageIndex]="filterForm().pageIndex">
    </app-paginator>
  </div>
</div>
